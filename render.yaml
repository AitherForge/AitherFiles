services:
  - type: web
    name: aitherfiles
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    autoDeploy: true
    envVars:
      - key: AITHERFILES_ORIGIN
        value: https://aitherforge.github.io
      # Cloudflare R2 S3-compatible endpoint. Set this to:
      # https://<CLOUDFLARE_ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: aitherfiles
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
