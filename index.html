<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="AitherFiles — a fast, private browser file manager.">
  <title>AitherFiles</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#f5f7fb;background:#0b0d12;color-scheme:dark;--panel:#151922;--panel2:#1c212c;--line:#2a3040;--muted:#9da5b5;--accent:#6ea8ff;--danger:#ff6b6b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#18243a 0,#0b0d12 42%);overflow-x:hidden}
    button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}
    header{height:72px;padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right));display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:#0d1016e8;backdrop-filter:blur(20px);position:sticky;top:0;z-index:5}
    .brand{font-size:21px;font-weight:750;letter-spacing:-.5px;white-space:nowrap}.brand span{color:var(--accent)}.search{flex:1;max-width:620px;margin:auto;position:relative}.search input{width:100%;height:44px;padding:0 42px;border:1px solid var(--line);border-radius:13px;background:var(--panel);outline:none;color:#fff}.search input:focus{border-color:#527ec4;box-shadow:0 0 0 3px #6ea8ff18}.search svg{position:absolute;left:14px;top:13px;width:18px;color:var(--muted)}
    .iconbtn{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}.iconbtn:hover,.primary:hover{filter:brightness(1.12)}
    main{width:min(1180px,100%);margin:0 auto;padding:22px 16px 100px;display:grid;grid-template-columns:230px 1fr;gap:24px}.sidebar{position:sticky;top:94px;height:max-content}.nav{display:grid;gap:6px}.nav button{background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#c6ccd7}.nav button.active,.nav button:hover{background:var(--panel2);color:#fff}.nav svg{width:18px;vertical-align:-4px;margin-right:9px}.storage{margin-top:22px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.storage small{color:var(--muted)}.bar{height:6px;background:#2b3140;border-radius:99px;margin:9px 0;overflow:hidden}.bar i{display:block;height:100%;width:37%;background:var(--accent);border-radius:99px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.crumbs{font-size:27px;font-weight:750;letter-spacing:-.8px}.actions{display:flex;gap:8px}.primary{background:var(--accent);color:#07111f;padding:10px 14px;border-radius:10px;font-weight:700}.secondary{background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:10px}
    .drop{border:1.5px dashed #46506a;border-radius:16px;padding:18px;text-align:center;background:#11151e;transition:.2s}.drop.drag{border-color:var(--accent);background:#142039}.drop strong{display:block;margin-bottom:4px}.drop p{margin:0;color:var(--muted);font-size:13px}.drop input{display:none}
    .section{margin-top:24px}.section h2{font-size:14px;color:var(--muted);font-weight:650;margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.file{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:116px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}.file:hover{border-color:#4b556b;transform:translateY(-1px)}.file.selected{outline:2px solid var(--accent)}.filetop{display:flex;justify-content:space-between}.fileicon{font-size:34px}.more{color:var(--muted);background:none}.filename{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:4px}.empty{text-align:center;padding:50px 10px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.empty b{display:block;color:#e8ebf1;margin-bottom:6px}
    dialog{border:1px solid var(--line);border-radius:16px;background:#151922;color:#fff;padding:20px;width:min(420px,calc(100% - 30px));box-shadow:0 30px 100px #000b}dialog::backdrop{background:#0009;backdrop-filter:blur(4px)}dialog h3{margin-top:0}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#f4f6fa;color:#10131a;padding:11px 16px;border-radius:12px;font-weight:650;transition:.2s;z-index:20;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
    @media(max-width:760px){header{height:62px}.brand{font-size:18px}.search{order:3;position:absolute;left:12px;right:12px;top:68px;max-width:none}.app main{padding-top:70px;display:block}.sidebar{display:none}.toolbar{align-items:flex-start}.crumbs{font-size:23px}.actions .secondary{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.file{min-height:112px}}
    @media(min-width:761px){.mobile-only{display:none}}
  </style>
</head>
<body><div class="app">
<header><div class="brand">Aither<span>Files</span></div><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" placeholder="Search files" aria-label="Search files"></div><button class="iconbtn" id="newFolder" title="New folder">＋</button></header>
<main><aside class="sidebar"><nav class="nav"><button class="active" data-filter="all">▣ &nbsp;All Files</button><button data-filter="recent">◷ &nbsp;Recent</button><button data-filter="favorites">☆ &nbsp;Favorites</button><button data-filter="images">▧ &nbsp;Images</button><button data-filter="documents">▤ &nbsp;Documents</button></nav><div class="storage"><small>Browser storage</small><div class="bar"><i></i></div><small id="storageText">Local files only</small></div></aside>
<section><div class="toolbar"><div class="crumbs" id="title">All Files</div><div class="actions"><button class="secondary" id="sort">Sort</button><button class="primary" id="uploadBtn">Upload</button></div></div>
<div class="drop" id="drop"><strong>Drop files here</strong><p>Files stay in your browser. Nothing is uploaded to a server.</p><input id="fileInput" type="file" multiple></div>
<div class="section"><h2 id="count">Files</h2><div class="grid" id="grid"></div></div></section></main></div>
<dialog id="folderDialog"><h3>New folder</h3><input id="folderName" placeholder="Folder name" style="width:100%;padding:11px;border-radius:10px;border:1px solid #343b4a;background:#0e1117;color:white;outline:none"><div class="dialog-actions"><button class="secondary" id="cancelFolder">Cancel</button><button class="primary" id="createFolder">Create</button></div></dialog><div class="toast" id="toast"></div>
<script>
(() => {
  const KEY='aitherfiles:v1'; let state=JSON.parse(localStorage.getItem(KEY)||'null')||{files:[]}; let filter='all', query='', sort='name';
  const $=s=>document.querySelector(s), grid=$('#grid');
  const icon=f=>f.kind==='folder'?'📁':f.type?.startsWith('image/')?'🖼️':f.type?.includes('pdf')?'📕':f.type?.includes('text')?'📄':f.type?.includes('zip')?'🗜️':'📄';
  const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
  const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};
  function visible(){let a=state.files.filter(f=>!query||f.name.toLowerCase().includes(query.toLowerCase()));if(filter==='recent')a=a.filter(f=>f.added> Date.now()-7*864e5);if(filter==='favorites')a=a.filter(f=>f.favorite);if(filter==='images')a=a.filter(f=>f.type?.startsWith('image/'));if(filter==='documents')a=a.filter(f=>f.type?.includes('pdf')||f.type?.includes('text')||f.type?.includes('word')||f.type?.includes('document'));return a.sort((a,b)=>sort==='date'?b.added-a.added:a.name.localeCompare(b.name));}
  function render(){const a=visible();$('#count').textContent=`${a.length} ${a.length===1?'item':'items'}`;grid.innerHTML='';if(!a.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><b>No files here yet</b>Upload a file or drop one above to get started.</div>';return}a.forEach(f=>{const e=document.createElement('article');e.className='file';e.innerHTML=`<div class="filetop"><span class="fileicon">${icon(f)}</span><button class="more" title="Favorite">${f.favorite?'★':'☆'}</button></div><div><div class="filename" title="${esc(f.name)}">${esc(f.name)}</div><div class="meta">${f.kind==='folder'?'Folder':format(f.size)}</div></div>`;e.querySelector('.more').onclick=ev=>{ev.stopPropagation();f.favorite=!f.favorite;save();render()};e.ondblclick=()=>openFile(f);grid.appendChild(e)});}
  function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function format(n){if(!n)return'—';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return`${n.toFixed(i?1:0)} ${u[i]}`}
  function add(files){[...files].forEach(f=>state.files.push({name:f.name,size:f.size,type:f.type,added:Date.now(),favorite:false}));save();render();toast(`${files.length} file${files.length===1?'':'s'} added`)}
  function openFile(f){if(f.kind==='folder'){toast('Folders are available in the local file list');return}toast('AitherFiles keeps file metadata locally in this version')}
  $('#uploadBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>add(e.target.files);$('#search').oninput=e=>{query=e.target.value;render()};$('#sort').onclick=()=>{sort=sort==='name'?'date':'name';toast(`Sorted by ${sort}`);render()};
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;$('#title').textContent=b.textContent.replace(/^[^A-Za-z]+/,'').trim();render()});
  const dialog=$('#folderDialog');$('#newFolder').onclick=()=>{dialog.showModal();$('#folderName').focus()};$('#cancelFolder').onclick=()=>dialog.close();$('#createFolder').onclick=()=>{const name=$('#folderName').value.trim();if(!name)return;state.files.push({name,kind:'folder',type:'',size:0,added:Date.now(),favorite:false});save();$('#folderName').value='';dialog.close();render();toast('Folder created')};
  const drop=$('#drop');['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>add(e.dataTransfer.files));
  render();
})();
</script></body></html>
