<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>AitherFiles</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#f5f7fb;background:#0b0d12;color-scheme:dark;--p:#151922;--p2:#1c212c;--l:#2a3040;--m:#9da5b5;--a:#6ea8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#18243a,#0b0d12 42%)}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{min-height:100vh}header{height:72px;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--l);background:#0d1016e8;backdrop-filter:blur(20px);position:sticky;top:0;z-index:5}.brand{font-size:21px;font-weight:750;white-space:nowrap}.brand span{color:var(--a)}.search{flex:1;max-width:620px;margin:auto}.search input{width:100%;height:44px;padding:0 16px;border:1px solid var(--l);border-radius:13px;background:var(--p);outline:0;color:#fff}.iconbtn,.secondary{background:var(--p);border:1px solid var(--l);border-radius:10px}.iconbtn{width:42px;height:42px}.layout{width:min(1180px,100%);margin:auto;padding:22px 16px 80px;display:grid;grid-template-columns:230px 1fr;gap:24px}.sidebar{position:sticky;top:94px;height:max-content}.nav{display:grid;gap:6px}.nav button{background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#c6ccd7}.nav button.active,.nav button:hover{background:var(--p2);color:#fff}.storage{margin-top:22px;padding:14px;background:var(--p);border:1px solid var(--l);border-radius:14px}.storage small{color:var(--m)}.bar{height:7px;background:#2b3140;border-radius:99px;margin:9px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--a);border-radius:99px;transition:.3s}.storage strong{display:block;margin-bottom:3px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title{font-size:27px;font-weight:750}.actions{display:flex;gap:8px}.primary{background:var(--a);color:#07111f;padding:10px 14px;border-radius:10px;font-weight:700}.secondary{padding:10px 14px}.drop{border:1.5px dashed #46506a;border-radius:16px;padding:22px;text-align:center;background:#11151e}.drop.drag{border-color:var(--a);background:#142039}.drop strong{display:block}.drop p{margin:5px 0 0;color:var(--m);font-size:13px}.drop input{display:none}.section{margin-top:24px}.section h2{font-size:14px;color:var(--m);margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.file{padding:14px;background:var(--p);border:1px solid var(--l);border-radius:14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between}.filetop{display:flex;justify-content:space-between}.fileicon{font-size:34px}.more{background:none;color:var(--m)}.filename{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--m);margin-top:4px}.empty{text-align:center;padding:50px 10px;color:var(--m);border:1px dashed var(--l);border-radius:14px;grid-column:1/-1}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#f4f6fa;color:#10131a;padding:11px 16px;border-radius:12px;font-weight:650;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){header{height:62px}.brand{font-size:18px}.search{order:3;position:absolute;left:12px;right:12px;top:68px;max-width:none}.layout{padding-top:70px;display:block}.sidebar{display:none}.title{font-size:23px}.actions .secondary{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><div class="app"><header><div class="brand">Aither<span>Files</span></div><div class="search"><input id="search" placeholder="Search cloud files" aria-label="Search cloud files"></div><button class="iconbtn" id="refresh">↻</button></header><div class="layout"><aside class="sidebar"><nav class="nav"><button class="active" data-filter="all">▣ &nbsp;All Files</button><button data-filter="recent">◷ &nbsp;Recent</button><button data-filter="images">▧ &nbsp;Images</button><button data-filter="documents">▤ &nbsp;Documents</button></nav><div class="storage"><strong>Cloud Storage</strong><div class="bar"><i id="bar"></i></div><small id="storageText">Loading…</small></div></aside><main><div class="toolbar"><div class="title" id="title">All Files</div><div class="actions"><button class="secondary" id="sort">Sort</button><button class="primary" id="uploadBtn">Upload</button></div></div><div class="drop" id="drop"><strong>Drop files here</strong><p>Files are stored in your AitherFiles cloud space.</p><input id="fileInput" type="file" multiple></div><div class="section"><h2 id="count">Files</h2><div class="grid" id="grid"></div></div></main></div></div><div class="toast" id="toast"></div><script>(()=>{const API=location.hostname.includes('github.io')?'https://aitherfiles.onrender.com/api':'/api';const KEY='aitherfiles-user';let uid=localStorage.getItem(KEY);if(!uid){uid=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem(KEY,uid)}let files=[],filter='all',q='',sort='name';const $=s=>document.querySelector(s),headers={'X-Aither-User':uid};const toast=t=>{let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};const fmt=n=>{let u=['B','KB','MB','GB'],i=0;while(n>=1024&&i<3){n/=1024;i++}return`${n.toFixed(i?1:0)} ${u[i]}`};const icon=f=>f.type?.startsWith('image/')?'🖼️':f.type?.includes('pdf')?'📕':f.type?.includes('text')?'📄':'📄';async function storage(){let r=await fetch(API+'/storage',{headers});if(!r.ok)return;let x=await r.json(),pct=Math.min(100,x.used/x.limit*100);$('#bar').style.width=pct+'%';$('#storageText').textContent=`${fmt(x.used)} of 3 GB used (${pct.toFixed(1)}%)`}async function load(){try{let r=await fetch(API+'/files',{headers});if(!r.ok)throw Error();files=(await r.json()).files;render();storage()}catch{toast('Cloud backend unavailable')}}function render(){let a=files.filter(f=>!q||f.name.toLowerCase().includes(q.toLowerCase()));if(filter==='recent')a=a.filter(f=>f.added>Date.now()-6048e5);if(filter==='images')a=a.filter(f=>f.type?.startsWith('image/'));if(filter==='documents')a=a.filter(f=>f.type?.includes('pdf')||f.type?.includes('text')||f.type?.includes('document')||f.type?.includes('word'));a.sort((x,y)=>sort==='date'?y.added-x.added:x.name.localeCompare(y.name));$('#count').textContent=`${a.length} ${a.length===1?'item':'items'}`;$('#grid').innerHTML=a.length?a.map(f=>`<article class="file"><div class="filetop"><span class="fileicon">${icon(f)}</span><button class="more" onclick="window.del('${f.id}')">⌫</button></div><div><div class="filename" title="${f.name.replace(/"/g,'&quot;')}">${f.name.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div><div class="meta">${fmt(f.size)}</div></div></article>`).join(''):'<div class="empty"><b>No cloud files yet</b>Upload a file to your 3 GB AitherFiles cloud.</div>'}window.del=async id=>{if(!confirm('Delete this file?'))return;await fetch(API+'/files/'+encodeURIComponent(id),{method:'DELETE',headers});load();toast('File deleted')};async function upload(list){for(const f of list){let fd=new FormData();fd.append('file',f);let r=await fetch(API+'/files',{method:'POST',headers,body:fd});if(!r.ok){let e=await r.json().catch(()=>({}));toast(e.error||'Upload failed');break}}load();toast('Upload complete')}$('#uploadBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>upload(e.target.files);$('#refresh').onclick=load;$('#search').oninput=e=>{q=e.target.value;render()};$('#sort').onclick=()=>{sort=sort==='name'?'date':'name';render();toast('Sort changed')};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;$('#title').textContent=b.textContent.trim();render()});const d=$('#drop');['dragenter','dragover'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.add('drag')}));['dragleave','drop'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.remove('drag')}));d.addEventListener('drop',e=>upload(e.dataTransfer.files));load()})();</script></body></html>
